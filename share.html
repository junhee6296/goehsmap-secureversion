<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화성오산 공유학교 지도</title>
  
  <meta name="description" content="경기도 화성시, 오산시의 초·중·고등학교 및 다(多)가치, 오산나래 공유학교 위치와 상세 정보를 한눈에 확인하세요.">
  <meta name="keywords" content="화성오산교육지원청, 화성 학교지도, 오산 학교지도, 공유학교 지도, 경기도, 화성시, 오산시">
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="화성오산 학교 & 공유학교 지도">
  <meta property="og:description" content="경기도 화성시와 오산시의 공유학교 위치와 프로그램 정보를 확인하세요.">
  <meta property="og:image" content="https://goehsschoolmap.o-r.kr/source/share.png"> 
  <meta property="og:url" content="https://goehsschoolmap.o-r.kr/share">

  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/vendor/markercluster/MarkerCluster.css" />
  <link rel="stylesheet" href="/vendor/markercluster/MarkerCluster.Default.css" />
  
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/marker.css" />
  <link rel="stylesheet" href="css/popup.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  
  <link rel="stylesheet" href="css/legend.css" />
  <link rel="stylesheet" href="css/tooltip.css" />
  <link rel="stylesheet" href="css/share.css" />
</head>
<body>
  <div class="container"> 
    <div class="pc-top-bar"></div>

    <header class="header-center-group">
      <div class="header-shape">
        <div class="logo-group">
          <button class="help-button" id="helpBtn">?</button>
        </div>
        <div class="title-wrapper">
          <a href="https://gong-u.goe.go.kr/base/main/view" target="_blank" class="logo-area">
            <img src="source/share.png" alt="Share" class="logo-img share-logo-img" />
          </a>
          <span class="header_text" id="header-title">화성오산 공유학교 지도</span>
          <a href="/" class="title-switch-btn image-switch" title="학교 지도로 전환">
            <img src="source/hwaologo.svg" alt="학교지도" class="switch-icon contain logo-switch-icon" />
          </a>
        </div>
        <div class="header-spacer"></div>
      </div>
    </header>
    
    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="schoolSearch" class="search-input-box" placeholder="공유학교명 검색" autocomplete="off" />
            <div id="searchResults" class="search-results-list"></div>
        </div>
    </div>

    <div class="mobile-bottom-bar"></div>

    <div class="boundary-toggle-container">
        <div class="control-row">
            <span class="switch-label">행정구역</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-boundary" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="map"></div>
    <button id="btn-measure" data-action="toggle-measure">📏 거리재기</button>

    <div id="helpModal" class="help-modal-overlay">
        <div class="help-modal-content">
            <span class="help-close-btn" data-action="close-help">&times;</span>
            <div id="helpContentInject"></div>
        </div>
    </div>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script> 
  <script src="js/map.js" defer></script>
  <script src="js/share_main.js" defer></script>
</body>
</html>
